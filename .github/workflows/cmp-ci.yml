name: "Compose Multiplatform CI"

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  android:
    name: Android (assemble + unit tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build KotStep + app and run unit tests
        run: ./gradlew :kotstep:assembleDebug :app:assembleDebug :kotstep:testDebugUnitTest --stacktrace

  desktop:
    name: Desktop (compile + shared tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile desktop targets and run desktopTest
        run: ./gradlew :demo:compileKotlinDesktop :desktopApp:compileKotlinDesktop :kotstep:desktopTest --stacktrace

  web:
    name: Web (Wasm assemble)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble wasmJS web app
        run: ./gradlew :webApp:assemble --stacktrace

  ios:
    name: iOS (simulator framework link)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Link shared iOS frameworks
        run: ./gradlew :kotstep:linkDebugFrameworkIosSimulatorArm64 :demo:linkDebugFrameworkIosSimulatorArm64 --stacktrace